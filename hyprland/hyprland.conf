# Minimal Hyprland config mirroring regolith3 (i3) setup.
# Where a shortcut is not customised below, the Regolith 3 default is reproduced.
# See SHORTCUTS.md in this folder for the human-readable list.

$mod = SUPER

# --- Appearance (from regolith3/Xresources) ---
general {
    gaps_in = 5            # wm.gaps.inner.size: 5
    gaps_out = 5
    border_size = 2        # wm.window.border.size: 2
    layout = dwindle

    # Simple blue/grey border (active = blue, inactive = grey)
    col.active_border = rgba(458588ee)
    col.inactive_border = rgba(45475aaa)
}

# --- Basic look & feel (kept minimal) ---
decoration {
    rounding = 6

    # Light shadow for depth; no blur to stay lightweight
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000044)
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, ease
}

# Status bar (optional but gives a usable desktop)
exec-once = waybar

# Wallpaper / solid background via hyprpaper (optional)
# exec-once = hyprpaper

# --- Autostart (from regolith3/i3/config.d/apps.conf) ---
exec-once = slack
exec-once = firefox
exec-once = /opt/cisco/anyconnect/bin/vpnui

# --- App -> workspace assignments (from apps.conf) ---
windowrulev2 = workspace 1, class:(Slack)
windowrulev2 = workspace 2, class:(Code)
windowrulev2 = workspace 3, class:(firefox-aurora)
windowrulev2 = workspace 4, class:(Com.cisco.anyconnect.gui)
windowrulev2 = workspace 4, class:(Gnome-control-center)

# --- Mouse: use $mod to move/resize floating windows (floating_modifier $mod) ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# === Launchers (Regolith defaults) ===
bind = $mod, Return, exec, kitty                 # Launch - Terminal
bind = $mod SHIFT, Return, exec, firefox         # Launch - Browser
bind = $mod, Space, exec, wofi --show drun       # Launch - Application
bind = $mod SHIFT, Space, exec, wofi --show run  # Launch - Command

# === Window management (Regolith defaults) ===
bind = $mod, f, fullscreen, 0                    # Fullscreen toggle
bind = $mod SHIFT, f, togglefloating             # Floating toggle
bind = $mod SHIFT, q, killactive                 # Close window
bind = $mod, t, togglesplit                      # Window layout mode (split)

# Focus relative window (h j k l + arrows)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move window position (Shift + h j k l + arrows)
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# === Workspaces (Regolith defaults) ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace (Shift + number)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Navigate next/previous workspace (Regolith defaults)
bind = $mod ALT, right, workspace, e+1
bind = $mod ALT, left, workspace, e-1
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1

# === Session (Regolith defaults) ===
bind = $mod, Escape, exec, hyprlock             # Lock screen
bind = $mod SHIFT, c, exec, hyprctl reload      # Reload config
bind = $mod SHIFT, e, exec, hyprctl dispatch exit  # Logout / exit

# === Custom bindings (from regolith3/i3/config.d/move_display.conf) ===
# Move focused workspace between monitors
bind = $mod CTRL, period, movecurrentworkspacetomonitor, +1    # $mod+Ctrl+greater
bind = $mod CTRL, comma, movecurrentworkspacetomonitor, -1     # $mod+Ctrl+less
# Switch to previously focused workspace ($mod+Mod1+w -> back_and_forth)
bind = $mod ALT, w, workspace, previous
