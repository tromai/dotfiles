# Set color when using tmux
set-option -g default-terminal "screen-256color"

# Compatibility with neovim
set-option -g focus-events on
set-option -g terminal-features ',xterm-256color:RGB'

# Use mouse to resize panel
set -g mouse on

# Use Ctrl+a as the prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim style pane selection
# Prefix + [h,j,k,l]
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Use vi mode for selection mode
# Prefix + [ -> use vi keys to navigate
set-option -g mode-keys vi
# Copy to clipboard
# yank in selection mode in tmux will copy to clipboard.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# keybindings for vi selection mod
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Fix escape delay in neovim
set -sg escape-time 0

# Increase scrollback limit
set-option -g history-limit 10000 # default is 2000

# The below solution is taken from https://github.com/nathanwn/dotfiles/blob/96010f10c34218eb095637d0d7d6b1efa8c3c5b8/home/.tmux.conf#L60
# Disable "mouse release exits copy mode"
# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane
# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection
# this line changes the default binding of MouseDrag1Pane, the only difference
# is that we use `copy-mode -eM` instead of `copy-mode -M`, so that WheelDownPane
# can trigger copy-mode to exit when copy-mode is entered by MouseDrag1Pane
bind-key -n MouseDrag1Pane if-shell -F -t = '#{mouse_any_flag}' "if -Ft= '#{pane_in_mode}' 'copy-mode -eM' 'send-keys -M' " "copy-mode -eM"

# Open new panes/windows with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Status line
set-option -g status-left-length 50
set -g mode-style "fg=#2e2e2e,bg=#d8d8d8"
set -wg mode-style "fg=#2e2e2e,bg=#d8d8d8"
set -g message-style "fg=#2e2e2e,bg=#d8d8d8"
set -g message-command-style "fg=#2e2e2e,bg=#d8d8d8"
set -g pane-border-style "fg=#d8d8d8"
set -g pane-active-border-style "fg=#2e2e2e"
set -g status-style "fg=#2e2e2e,bg=#c9c9c9"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
